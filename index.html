<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Perguntas - JS + PHP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Área de alertas -->
        <div id="alerta" class="alerta oculto"></div>

        <!-- TELA 1: LISTAGEM -->
        <section id="tela-lista">
            <div class="header-action">
                <h2>Perguntas Cadastradas</h2>
                <button type="button" class="btn btn-salvar" onclick="abrirFormulario()">+ Nova Pergunta</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Pergunta</th>
                        <th>Opções</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo">
                    <tr><td colspan="4">Carregando perguntas...</td></tr>
                </tbody>
            </table>
        </section>

        <!-- TELA 2: CADASTRAR / EDITAR -->
        <section id="tela-form" class="oculto">
            <h2 id="titulo-form">Criar Nova Pergunta</h2>

            <form id="form-pergunta">
                <input type="hidden" id="pergunta-id">

                <div class="form-group">
                    <label for="pergunta-texto">Texto da Pergunta</label>
                    <textarea id="pergunta-texto" rows="3" placeholder="Digite a pergunta..." required></textarea>
                </div>

                <h3>Respostas de Múltipla Escolha</h3>
                <p class="subtexto">Preencha as alternativas e marque o botão referente à resposta correta.</p>

                <div class="form-group-opcao">
                    <input type="radio" name="correta" value="0" checked>
                    <input type="text" class="input-resposta" placeholder="Opção 1" required>
                </div>
                <div class="form-group-opcao">
                    <input type="radio" name="correta" value="1">
                    <input type="text" class="input-resposta" placeholder="Opção 2" required>
                </div>
                <div class="form-group-opcao">
                    <input type="radio" name="correta" value="2">
                    <input type="text" class="input-resposta" placeholder="Opção 3">
                </div>
                <div class="form-group-opcao">
                    <input type="radio" name="correta" value="3">
                    <input type="text" class="input-resposta" placeholder="Opção 4">
                </div>

                <div class="acoes">
                    <button type="button" class="btn btn-voltar" onclick="voltarParaLista()">Voltar</button>
                    <button type="submit" class="btn btn-salvar">Salvar Pergunta</button>
                </div>
            </form>
        </section>

        <!-- TELA 3: VISUALIZAR DETALHES -->
        <section id="tela-detalhes" class="oculto">
            <h2 id="detalhe-titulo">Pergunta</h2>
            <p id="detalhe-texto" class="pergunta-destaque"></p>

            <h3>Opções de Resposta:</h3>
            <ul id="detalhe-respostas" class="lista-respostas"></ul>

            <div class="acoes">
                <button type="button" class="btn btn-voltar" onclick="voltarParaLista()">Voltar</button>
                <button type="button" id="btn-detalhe-editar" class="btn btn-salvar">Editar</button>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
